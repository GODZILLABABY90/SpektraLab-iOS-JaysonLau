name: SpektraLabIOS
options:
  bundleIdPrefix: io.github.godzillababy90
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  SpektraLabIOS:
    type: application
    platform: iOS
    sources:
      - path: SpektraLabIOS
        excludes:
          - OriginalEngineResources
      - path: SpektraLabIOS/OriginalEngineResources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.godzillababy90.spektralabios
        GENERATE_INFOPLIST_FILE: "YES"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/build/upstream-SpektraLab/engine/src/core"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "$(SRCROOT)/build/upstream-probe/libspektralab-core-ios.a"
          - "$(SRCROOT)/build/upstream-pipeline-probe/libspektralab-pipeline-ios.a"
          - "$(SRCROOT)/build/upstream-gpu-probe/libspektralab-gpu-ios.a"
        INFOPLIST_KEY_CFBundleDisplayName: "SpektraLab iOS"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: "NO"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select a photo to edit with film-inspired controls."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your edited photos to the photo library."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    dependencies: []
schemes:
  SpektraLabIOS:
    build:
      targets:
        SpektraLabIOS: all
    run:
      config: Debug
    archive:
      config: Release
