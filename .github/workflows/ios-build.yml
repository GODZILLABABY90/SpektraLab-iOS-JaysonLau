name: iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [dev/ios-foundation, dev/film-presets-v02, dev/upstream-engine-port, dev/original-render-bridge]
  pull_request:
    branches: [main, dev/upstream-engine-port]
concurrency:
  group: native-ios-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile original GPL-licensed C++ spectral core for iPhoneOS
        run: bash scripts/probe-upstream-ios.sh
      - name: Compile original film-print pipeline
        run: bash scripts/probe-upstream-pipeline-ios.sh
      - name: Compile original GPU backend
        run: bash scripts/probe-upstream-gpu-ios.sh
      - name: Compile original iOS Metal shaders
        run: bash scripts/probe-upstream-metal-ios.sh
      - name: Bundle original film, paper and Metal assets
        run: bash scripts/bundle-upstream-ios-resources.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SpektraLabIOS.xcodeproj -scheme SpektraLabIOS \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package corresponding original upstream source
        run: |
          git -C build/upstream-SpektraLab archive --format=tar HEAD | gzip -9 > SpektraLab-upstream-source.tar.gz
          cp build/upstream-revision.txt UPSTREAM-REVISION.txt
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/SpektraLabIOS.app Payload/
          zip -qry SpektraLabIOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpektraLabIOS-unsigned-IPA
          path: SpektraLabIOS-unsigned.ipa
          if-no-files-found: error
      - name: Upload corresponding upstream source
        uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-original-engine-source
          path: |
            SpektraLab-upstream-source.tar.gz
            UPSTREAM-REVISION.txt
          if-no-files-found: error
      - name: Upload upstream engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-engine-diagnostics
          path: |
            build/upstream-probe/results.txt
            build/upstream-probe/*.log
            build/upstream-pipeline-probe/results.txt
            build/upstream-pipeline-probe/*.log
            build/upstream-gpu-probe/results.txt
            build/upstream-gpu-probe/*.log
            build/upstream-metal-ios/results.txt
            build/upstream-metal-ios/*.log
            build/upstream-revision.txt
          if-no-files-found: warn
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore
